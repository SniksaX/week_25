<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TechHelp - Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>TechHelp Support</h1>
        <p>Décrivez votre problème informatique (mot de passe, VPN, imprimante, etc.).</p>

        <form id="chat-form">
            <label for="prompt">Votre message</label>
            <textarea id="prompt" rows="5" required placeholder="Ex: Je n'arrive pas à me connecter au VPN..."></textarea>
            <button type="submit">Interroger l'assistant</button>
        </form>

        <section aria-live="polite">
            <h2>Réponse</h2>
            <p id="status"></p>
            <div id="answer"></div>
            
            <div id="escalate-container" class="hidden">
                <hr>
                <p><small>Le problème persiste malgré ces étapes ?</small></p>
                <button id="btn-escalate" type="button">🚨 Transférer à un technicien humain</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
