<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TechHelp - Espace Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div id="login-view">
            <h1>Connexion Admin</h1>
            <p>Accès réservé aux techniciens TechHelp.</p>
            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="admin@techhelp.com">
                
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required>
                
                <button type="submit">Se connecter</button>
            </form>
            <p id="login-error" class="error-msg hidden"></p>
        </div>

        <div id="dashboard-view" class="hidden">
            <div class="header-flex">
                <h1>Tickets Escaladés</h1>
                <button id="btn-logout" class="btn-small">Déconnexion</button>
            </div>
            <p>Les nouveaux tickets apparaissent en temps réel.</p>
            
            <div id="tickets-list">
                <p id="no-tickets">Aucun ticket pour le moment...</p>
            </div>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
